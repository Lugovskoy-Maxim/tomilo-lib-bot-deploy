services:
  max-bot:
    build: .
    image: tomilo-lib-max-bot:local
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_PATH: /data/bot-state.json
    volumes:
      - max-bot-state:/data
    cap_drop:
      - ALL
    pids_limit: 80
    mem_limit: 192m
    cpus: 0.50

volumes:
  max-bot-state:
